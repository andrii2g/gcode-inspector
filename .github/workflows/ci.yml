name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/A2G.GCodeInspector.Tests/A2G.GCodeInspector.Tests.csproj --configfile NuGet.Config

      - name: Build
        run: dotnet build gcode-inspector.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/A2G.GCodeInspector.Tests/A2G.GCodeInspector.Tests.csproj --no-build --configuration Release
